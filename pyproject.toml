[project]
name = "pranav-agent-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "requests>=2.32.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "interview-agent", "mcp-server", "contracts"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.4",
    "pyright>=1.1.389",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["kb", "shared", "interview-agent", "mcp-server", "contracts"]
exclude = ["**/dist", "**/.venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["kb", "shared", "interview-agent", "mcp-server", "contracts"]
